name: Build Odin Android game

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ODIN_VERSION: dev-2026-07a
      ODIN_SHA256: 32a7678abc66f1af7353abb5b0b5da47d94b7e663f6d250df29bc9117e864c10
      ANDROID_API: 34
      ANDROID_MIN_API: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;34.0.0"

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Odin
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/odin.tar.gz"
          url="https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"

          curl --fail --location --retry 5 "$url" --output "$archive"
          echo "${ODIN_SHA256}  ${archive}" | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/odin"
          tar -xzf "$archive" --directory "$RUNNER_TEMP/odin"

          ODIN_BIN="$(find "$RUNNER_TEMP/odin" -type f -name odin -print -quit)"
          test -n "$ODIN_BIN"
          chmod +x "$ODIN_BIN"

          echo "ODIN_BIN=$ODIN_BIN" >> "$GITHUB_ENV"
          "$ODIN_BIN" version

      - name: Build Odin libraries
        shell: bash
        run: |
          set -euo pipefail

          NDK_ROOT="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}"
          test -n "$NDK_ROOT"

          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"

          mkdir -p build/lib/arm64-v8a build/lib/armeabi-v7a

          build_abi() {
            local target="$1"
            local clang="$2"
            local object="$3"
            local glue_object="$4"
            local output="$5"

            "$ODIN_BIN" build src \
              -target:"$target" \
              -build-mode:obj \
              -reloc-mode:pic \
              -out:"$object"

            "$clang" -fPIC -O3 \
              -ffunction-sections \
              -fdata-sections \
              -I"$GLUE" \
              -c "$GLUE/android_native_app_glue.c" \
              -o "$glue_object"

            "$clang" -shared -fPIC \
              -Wl,--gc-sections \
              -Wl,-z,max-page-size=16384 \
              -Wl,-u,ANativeActivity_onCreate \
              "$object" \
              "$glue_object" \
              -landroid \
              -llog \
              -lm \
              -o "$output"
          }

          build_abi \
            linux_arm64 \
            "$TOOLCHAIN/aarch64-linux-android${ANDROID_MIN_API}-clang" \
            build/game-arm64.o \
            build/glue-arm64.o \
            build/lib/arm64-v8a/libmain.so

          build_abi \
            linux_arm32 \
            "$TOOLCHAIN/armv7a-linux-androideabi${ANDROID_MIN_API}-clang" \
            build/game-arm32.o \
            build/glue-arm32.o \
            build/lib/armeabi-v7a/libmain.so

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p staging/lib/arm64-v8a
          mkdir -p staging/lib/armeabi-v7a
          mkdir -p staging/assets

          cp build/lib/arm64-v8a/libmain.so \
            staging/lib/arm64-v8a/libmain.so

          cp build/lib/armeabi-v7a/libmain.so \
            staging/lib/armeabi-v7a/libmain.so

          SDK_ROOT="$ANDROID_HOME"
          BUILD_TOOLS="$SDK_ROOT/build-tools/34.0.0"

          "$BUILD_TOOLS/aapt" package -f \
            -M AndroidManifest.xml \
            -I "$SDK_ROOT/platforms/android-${ANDROID_API}/android.jar" \
            -F unsigned.apk \
            staging

          "$BUILD_TOOLS/zipalign" -f -v 4 \
            unsigned.apk aligned.apk

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias debug \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CB4 Odin Debug"

          "$BUILD_TOOLS/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --out CB4-Odin.apk \
            aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CB4-Odin-APK
          path: CB4-Odin.apk
