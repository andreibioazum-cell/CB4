name: Build Modular Hardcore 2D (C+Zig Graphics)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: android-actions/setup-android@v3
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Install Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.13.0
    - name: Download stb_image.h and stb_truetype.h
      run: |
        wget https://raw.githubusercontent.com/nothings/stb/master/stb_image.h
        wget https://raw.githubusercontent.com/nothings/stb/master/stb_truetype.h
    - name: Build Zig graphics
      run: |
        mkdir -p build
        zig build-obj graphics.zig -target aarch64-linux-android -O ReleaseSmall -femit-bin=build/graphics_zig_64.o -fPIC
        zig build-obj graphics.zig -target arm-linux-androideabi -O ReleaseSmall -femit-bin=build/graphics_zig_32.o -fPIC -mcpu=arm_1176jzf_s
    - name: Build
      run: |
        NDK_ROOT=$ANDROID_NDK_ROOT
        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        GLUE="$NDK_ROOT/sources/android/native_app_glue"
        SRCS="main.c game.c font.c ui.c $GLUE/android_native_app_glue.c"
        FLAGS="-O3 -s -fPIC -shared -I. -I$GLUE -landroid -llog -lm"
        "$TOOLCHAIN/aarch64-linux-android21-clang" $SRCS build/graphics_zig_64.o -o libmain_64.so $FLAGS
        "$TOOLCHAIN/armv7a-linux-androideabi21-clang" $SRCS build/graphics_zig_32.o -o libmain_32.so $FLAGS -mfpu=neon
    - name: Package
      run: |
        mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/assets
        cp libmain_64.so staging/lib/arm64-v8a/libmain.so
        cp libmain_32.so staging/lib/armeabi-v7a/libmain.so
        cp cube.png staging/assets/ 2>/dev/null || echo "cube.png not found"
        cp Roboto-Regular.ttf staging/assets/ 2>/dev/null || echo "Roboto-Regular.ttf not found"
        SDK_ROOT=$ANDROID_HOME
        BT="$SDK_ROOT/build-tools/34.0.0"
        "$BT/aapt" package -f -M ./AndroidManifest.xml -I "$SDK_ROOT/platforms/android-34/android.jar" -F unsigned.apk ./staging/
        "$BT/zipalign" -v 4 unsigned.apk aligned.apk
        keytool -genkey -v -keystore debug.keystore -storepass android -alias debug -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
        "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --out Game.apk aligned.apk
    - uses: actions/upload-artifact@v4
      with:
        name: Game-APK
        path: Game.apk
